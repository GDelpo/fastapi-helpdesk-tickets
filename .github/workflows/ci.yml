name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tickets_user
          POSTGRES_PASSWORD: ci-db-password
          # The reminder tests only ever use "<DB_NAME>_test".
          POSTGRES_DB: tickets_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tickets_user" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the CI database only.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: tickets_user
      DB_PASSWORD: ci-db-password
      DB_NAME: tickets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Python of docker/Dockerfile.
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
